name: Foundation host checks

on:
  pull_request:
  push:
    branches: [main, plan/foundation]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run plugin:check
      - run: npm run build
      - name: Verify generated bindings
        run: |
          git diff --exit-code -- nitrogen/
          test -z "$(git ls-files --others --exclude-standard nitrogen/)"
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts
